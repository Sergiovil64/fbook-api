version: 0.2

env:
  shell: bash
  variables:
    SERVICE: usuario

phases:
  build:
    commands:
      - git fetch --tags --force || true
      - TAG=$(git tag --points-at HEAD | grep "^${SERVICE}-v" | head -n1)
      - if [ -z "$TAG" ]; then echo "ERROR no ${SERVICE}-v* tag at HEAD; cannot derive version"; exit 1; fi
      - echo "Tag at HEAD for ${SERVICE} = $TAG"
      - VERSION="${TAG#${SERVICE}-v}"
      - MAJOR="$(echo $VERSION | cut -d. -f1)"
      - MINOR="${MAJOR}.$(echo $VERSION | cut -d. -f2)"
      - echo "VERSION=$VERSION MAJOR=$MAJOR MINOR=$MINOR REPO_URI=$REPO_URI"
      - aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com
      - docker build --target production -f services/${SERVICE}/Dockerfile -t ${REPO_URI}:${VERSION} .
      - docker tag ${REPO_URI}:${VERSION} ${REPO_URI}:${MINOR}
      - docker tag ${REPO_URI}:${VERSION} ${REPO_URI}:${MAJOR}
      - docker tag ${REPO_URI}:${VERSION} ${REPO_URI}:latest
      - docker push ${REPO_URI}:${VERSION}
      - docker push ${REPO_URI}:${MINOR}
      - docker push ${REPO_URI}:${MAJOR}
      - docker push ${REPO_URI}:latest
      - 'echo "{\"version\":\"$VERSION\",\"repo\":\"$REPO_URI\"}" > image-info.json'

artifacts:
  files:
    - image-info.json
