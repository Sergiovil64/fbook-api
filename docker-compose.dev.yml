services:
  # DynamoDB Local 
  dynamodb-usuario:
    image: amazon/dynamodb-local:latest
    container_name: fbook-dynamodb-usuario
    ports:
      - "8001:8000"
    command: "-jar DynamoDBLocal.jar -inMemory"

  dynamodb-amistad:
    image: amazon/dynamodb-local:latest
    container_name: fbook-dynamodb-amistad
    ports:
      - "8002:8000"
    command: "-jar DynamoDBLocal.jar -inMemory"

  dynamodb-publicacion:
    image: amazon/dynamodb-local:latest
    container_name: fbook-dynamodb-publicacion
    ports:
      - "8003:8000"
    command: "-jar DynamoDBLocal.jar -inMemory"

  # Microservicios NestJS (desarrollo con hot-reload) 
  service-usuario:
    build:
      context: .
      dockerfile: services/usuario/Dockerfile
      target: development
    container_name: fbook-service-usuario-dev
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
      DYNAMODB_ENDPOINT: http://dynamodb-usuario:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      TABLE_NAME: Usuarios
    volumes:
      - ./services/usuario/src:/fbook_api/services/usuario/src
      - ./smithy_api/generated:/fbook_api/smithy_api/generated
    depends_on:
      - dynamodb-usuario

  service-amistad:
    build:
      context: .
      dockerfile: services/amistad/Dockerfile
      target: development
    container_name: fbook-service-amistad-dev
    ports:
      - "3002:3000"
    environment:
      PORT: 3000
      DYNAMODB_ENDPOINT: http://dynamodb-amistad:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      TABLE_NAME: Amistades
      USUARIO_SERVICE_URL: http://service-usuario:3000
    volumes:
      - ./services/amistad/src:/fbook_api/services/amistad/src
      - ./smithy_api/generated:/fbook_api/smithy_api/generated
    depends_on:
      - dynamodb-amistad
      - service-usuario

  service-publicacion:
    build:
      context: .
      dockerfile: services/publicacion/Dockerfile
      target: development
    container_name: fbook-service-publicacion-dev
    ports:
      - "3003:3000"
    environment:
      PORT: 3000
      DYNAMODB_ENDPOINT: http://dynamodb-publicacion:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      TABLE_NAME: Publicaciones
      TABLE_COMENTARIOS: Comentarios
      TABLE_REACCIONES: Reacciones
      USUARIO_SERVICE_URL: http://service-usuario:3000
      PUBLICACION_SERVICE_URL: http://service-publicacion:3000
      # Servicio NLP: detección de idioma + traducción al inglés (Fase 1 ciberbullying)
      NLP_SERVICE_URL: http://service-nlp:8000
    volumes:
      - ./services/publicacion/src:/fbook_api/services/publicacion/src
      - ./smithy_api/generated:/fbook_api/smithy_api/generated
    depends_on:
      dynamodb-publicacion:
        condition: service_started
      service-usuario:
        condition: service_started
      service-nlp:
        condition: service_healthy

  # Microservicio NLP — Python/FastAPI (detección de idioma + traducción)
  service-nlp:
    build:
      context: ./services/nlp
      dockerfile: Dockerfile
      target: development
    container_name: fbook-service-nlp-dev
    ports:
      - "8000:8000"
    environment:
      FASTTEXT_MODEL_PATH: /app/lid.176.ftz
      MODELO_TRADUCCION: Helsinki-NLP/opus-mt-es-en
      TRANSFORMERS_CACHE: /app/model_cache
    # Monta solo el código fuente (app/) para hot-reload con uvicorn --reload.
    # Los modelos (lid.176.ftz y model_cache) viven dentro de la imagen
    # y NO se montan: son muy pesados (~300 MB) y se descargan en el build.
    volumes:
      - ./services/nlp/app:/app/app
    # Healthcheck: espera hasta que los modelos estén cargados y el servicio responda.
    # service-publicacion no arrancará hasta que este check pase (condition: service_healthy).
    # start_period de 60s da tiempo para que uvicorn y los modelos terminen de cargar.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

volumes:
  dynamodb_usuario_data:
  dynamodb_amistad_data:
  dynamodb_publicacion_data:
