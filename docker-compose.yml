## Este archivo NO se usa en el despliegue real en EC2.
## En producción cada EC2 levanta su contenedor con "docker run" usando
## las variables de /opt/fbook.env que provisiona el CDK automáticamente.
## Ver README.md paso 8 o el repo fbook-cdk para los comandos exactos.
##
## Usos válidos de este archivo:
##   - Referencia de la configuración de cada servicio (puertos, variables, IPs)
##   - Correr las 3 imágenes de ECR localmente para pruebas de integración:
##       docker compose up -d service-usuario
##       docker compose up -d service-amistad
##       docker compose up -d service-publicacion
##
## Requiere .env con:
##   ECR_REGISTRY = <account-id>.dkr.ecr.<region>.amazonaws.com
##   AWS_REGION   = us-east-1
##   IMAGE_TAG    = latest

services:
  ## Microservicios NestJS
  service-usuario:
    image: ${ECR_REGISTRY}/fbook-service-usuario:${IMAGE_TAG:-latest}
    container_name: fbook-service-usuario
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      AWS_REGION: ${AWS_REGION}
      TABLE_NAME: Usuarios
    restart: unless-stopped

  service-amistad:
    image: ${ECR_REGISTRY}/fbook-service-amistad:${IMAGE_TAG:-latest}
    container_name: fbook-service-amistad
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      AWS_REGION: ${AWS_REGION}
      TABLE_NAME: Amistades
      USUARIO_SERVICE_URL: http://10.0.2.10:3000
    restart: unless-stopped

  service-publicacion:
    image: ${ECR_REGISTRY}/fbook-service-publicacion:${IMAGE_TAG:-latest}
    container_name: fbook-service-publicacion
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      AWS_REGION: ${AWS_REGION}
      TABLE_NAME: Publicaciones
      TABLE_COMENTARIOS: Comentarios
      TABLE_REACCIONES: Reacciones
      USUARIO_SERVICE_URL: http://10.0.2.10:3000
      PUBLICACION_SERVICE_URL: http://10.0.2.12:3000
    restart: unless-stopped
